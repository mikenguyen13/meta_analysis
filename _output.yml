# bs4_book is listed first so a bare render_book() builds the website.
bookdown::bs4_book:
  repo:
    base: https://github.com/mikenguyen13/meta_analysis
    branch: master
  includes:
    in_header: [google_analytics.html]
  css: style.css
  theme:
    primary: "#1f4e79"
  resource_files:
    - robots.txt
    - llms.txt
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
