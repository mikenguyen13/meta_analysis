name: Build and deploy book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (JAGS for RoBMA and gemtc)
        run: |
          sudo apt-get update
          sudo apt-get install -y jags libglpk-dev libgsl-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: rlib-${{ runner.os }}-

      # The JAGS stack is pinned. RoBMA and BayesTools require JAGS < 5 (Ubuntu
      # ships 4.3.2), but CRAN's rjags 5-x requires JAGS >= 5 and runjags
      # 2.3.1 (2026-11-23) requires rjags >= 5-5. RoBMA is held at the 3.6
      # API the chapters use. These are installed first from the CRAN archive,
      # then the remaining dependencies with upgrade = FALSE so the pins are
      # kept. (One pak plan with both sources of a package is a conflict.)
      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages("pak", repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.Version()$os, R.Version()$arch))
          arch <- "https://cran.r-project.org/src/contrib/Archive"
          pins <- c(rjags = "rjags/rjags_4-18", runjags = "runjags/runjags_2.2.2-5",
                    BayesTools = "BayesTools/BayesTools_0.2.22", RoBMA = "RoBMA/RoBMA_3.6.0")
          want <- c(rjags = "4.18", runjags = "2.2.2.5", BayesTools = "0.2.22", RoBMA = "3.6.0")
          have <- vapply(names(want), function(p) tryCatch(
            as.character(packageVersion(p)), error = function(e) ""), "")
          if (any(have != want)) {
            pak::pkg_install(sprintf("%s=url::%s/%s.tar.gz", names(pins), arch, pins),
                             upgrade = TRUE)
          }
          pak::local_install_deps(upgrade = FALSE, dependencies = TRUE)
          for (p in names(want)) stopifnot(as.character(packageVersion(p)) == want[[p]])
          library(rjags)
          library(RoBMA)

      # No knitr chunk cache in CI: every deploy runs all code from scratch, so a
      # stale cache can never hide or cause a failure (a cached chunk skips its
      # library() calls, and lazy-loaded datasets from that package vanish).
      - name: Render book
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book", quiet = TRUE)'

      - name: Sitemap and source stamp
        run: |
          Rscript generate_sitemap.R
          cp robots.txt llms.txt favicon.ico logo.png _book/
          touch _book/.nojekyll
          echo "${GITHUB_SHA}" > _book/SOURCE_COMMIT

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _book
          single-commit: false
          commit-message: "Deploy ${{ github.sha }} from ${{ github.ref_name }}"
