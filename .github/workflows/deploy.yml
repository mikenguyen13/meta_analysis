name: Build and deploy book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: no
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (JAGS for RoBMA and gemtc)
        run: |
          sudo apt-get update
          sudo apt-get install -y jags libglpk-dev libgsl-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: rlib-${{ runner.os }}-

      # RoBMA and BayesTools require JAGS < 5 (Ubuntu ships 4.3.2), but CRAN's
      # current rjags (5-x) requires JAGS >= 5. Install the last 4.x rjags first,
      # then the book's dependencies with upgrade = FALSE so it is kept. Doing
      # both in one pak plan is a source conflict.
      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages("pak", repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.Version()$os, R.Version()$arch))
          if (!requireNamespace("rjags", quietly = TRUE) ||
              packageVersion("rjags") >= "5") {
            pak::pkg_install(
              "rjags=url::https://cran.r-project.org/src/contrib/Archive/rjags/rjags_4-18.tar.gz",
              upgrade = TRUE)
          }
          pak::local_install_deps(upgrade = FALSE, dependencies = TRUE)
          stopifnot(packageVersion("rjags") < "5")
          library(rjags)

      - name: Cache knitr chunks
        uses: actions/cache@v4
        with:
          path: |
            _bookdown_files
            *_cache
          key: knitr-${{ runner.os }}-${{ hashFiles('*.Rmd', '_common.R', 'DESCRIPTION') }}
          restore-keys: knitr-${{ runner.os }}-

      - name: Render book
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book", quiet = TRUE)'

      - name: Sitemap and source stamp
        run: |
          Rscript generate_sitemap.R
          touch _book/.nojekyll
          echo "${GITHUB_SHA}" > _book/SOURCE_COMMIT

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _book
          single-commit: false
          commit-message: "Deploy ${{ github.sha }} from ${{ github.ref_name }}"
